name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only, secret-less GITHUB_TOKEN and can't push to
    # GHCR — skip them cleanly instead of failing red. Same-repo PR branches
    # are unaffected by this check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    strategy:
      # Matrix legs otherwise run in parallel, which defeats the shared
      # cache scope below: the debug leg would start building before the
      # production leg has finished writing anything to cache, so it'd
      # redo the identical deps-install/migrations layers from scratch
      # instead of hitting cache. max-parallel forces production (listed
      # first) to finish and push its cache before debug starts, so debug
      # only actually spends time on the one step that differs.
      max-parallel: 1
      matrix:
        include:
          # Normal image: React's minified production bundle (errors show
          # as numeric codes, see react.dev/errors/<code>).
          - variant: ''
            build_mode: production
          # Debug image: React's unminified dev bundle, with full in-browser
          # error messages/warnings - larger and slower, not for real
          # traffic, but much easier to diagnose a reported error against.
          - variant: '-debug'
            build_mode: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staged under a per-run tag (not a fixed :amd64) so concurrent runs
      # from different triggers (a PR build and a main push, say) can't
      # clobber each other's intermediate image before merge-manifests reads it.
      # Both matrix legs share one cache scope - everything before the final
      # webapp build step is identical between them, so the debug leg reuses
      # the production leg's cached deps/migration layers.
      - name: Build and push amd64 (${{ matrix.build_mode }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_MODE=${{ matrix.build_mode }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.run_id }}${{ matrix.variant }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # build-arm64:
  #   runs-on: ubuntu-24.04-arm
  #   timeout-minutes: 15
  #   permissions:
  #     contents: read
  #     packages: write
  #   outputs:
  #     digest: ${{ steps.build.outputs.digest }}
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3

  #     - name: Log in to Container Registry
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ${{ env.REGISTRY }}
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}

  #     - name: Build and push arm64
  #       id: build
  #       uses: docker/build-push-action@v6
  #       with:
  #         context: .
  #         platforms: linux/arm64
  #         push: true
  #         tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64
  #         cache-from: type=gha,scope=arm64
  #         cache-to: type=gha,mode=max,scope=arm64

  merge-manifests:
    runs-on: ubuntu-latest
    # needs: [build-amd64, build-arm64]
    needs: [build-amd64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Must mirror build-amd64's matrix - tags the debug image built
        # there (see docker-publish.yml's BUILD_MODE comment) alongside the
        # normal one, under the same tag names with a "-debug" suffix.
        variant: ['', '-debug']
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every push gets an immutable sha tag, plus a floating tag named after
      # the branch it came from (e.g. `main`) tracking that branch's tip.
      # `latest` and the version tag are reserved for actual `vX.Y.Z` tag
      # pushes, so a regular commit never becomes "latest".
      - name: Tag commit
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}${{ matrix.variant }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}${{ matrix.variant }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.run_id }}${{ matrix.variant }}

      - name: Tag release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}${{ matrix.variant }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}${{ matrix.variant }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ matrix.variant }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.run_id }}${{ matrix.variant }}

      # PR builds get a floating :pr-<number> tag (updates on every push to
      # the PR) plus the immutable sha, so a tester can pull a specific PR's
      # image without it ever touching :latest or a branch tag.
      - name: Tag pull request
        if: github.event_name == 'pull_request'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}${{ matrix.variant }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}${{ matrix.variant }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.run_id }}${{ matrix.variant }}
