services:
  receipthero:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm run dev
    environment:
      - DATABASE_PATH=/app/data/receipthero.db
      - CONFIG_PATH=/app/data/config.json
      - PORT=3000 # Webapp's Nitro server binds here; API is hardcoded to 3001
    volumes:
      - ./data:/app/data
    ports:
      - '3000:3000' # Webapp only - API/Worker internal
    restart: unless-stopped
